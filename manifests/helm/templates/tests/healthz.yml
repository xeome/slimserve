# The app image has no HTTP client.
apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test-healthz" .Release.Name | quote }}
  # The release namespace, where helm test --logs looks; the Service may sit in slimserve.namespace.
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "slimserve.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
      command:
        - wget
        - -q
        - -T
        - "10"
        - -O-
        - {{ printf "http://%s.%s:%v/.app/healthz" (include "slimserve.main" .) (include "slimserve.namespace" .) (index .Values.service.ports 0).port | quote }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
