{{- $auth := .Values.auth -}}
{{- $credentials := dict -}}
{{- range $key, $value := dict "SLIMSERVE_PASSWORD" $auth.password "SLIMSERVE_WRITE_PASSWORD" $auth.writePassword "SECRET_KEY_BASE" $auth.secretKeyBase -}}
  {{- if $value -}}
    {{- $_ := set $credentials $key (toString $value | b64enc) -}}
  {{- end -}}
{{- end -}}
{{- if $credentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slimserve.secret" . | quote }}
  namespace: {{ include "slimserve.namespace" . | quote }}
type: Opaque
data:
  {{- toYaml $credentials | nindent 2 }}
{{- end }}
