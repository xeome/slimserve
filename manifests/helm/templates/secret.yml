{{- $data := dict -}}
{{- if not .Values.existingSecret -}}
  {{- range include "slimserve.credentials" . | fromYamlArray -}}
    {{- if index . 2 -}}
      {{- $_ := set $data (index . 0) (index . 2 | b64enc) -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slimserve.secret" . | quote }}
  namespace: {{ include "slimserve.namespace" . | quote }}
  labels:
    {{- include "slimserve.labels" . | nindent 4 }}
type: Opaque
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}
