{{- $credentials := include "slimserve.credentials" . | fromYaml -}}
{{- if $credentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slimserve.secret" . | quote }}
  namespace: {{ include "slimserve.namespace" . | quote }}
type: Opaque
data:
  {{- toYaml $credentials | nindent 2 }}
{{- end }}
