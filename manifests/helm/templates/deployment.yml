{{- $name := include "slimserve.main" . -}}
{{- $namespace := include "slimserve.namespace" . -}}
{{- $auth := .Values.auth -}}
{{- $hasCredentials := include "slimserve.credentials" . | fromYaml -}}
{{- $s3 := eq (toString .Values.storage.backend) "s3" -}}
{{- $replicas := int .Values.replicas -}}
{{- if not (has (toString .Values.storage.backend) (list "local" "s3")) -}}
  {{- fail "storage.backend must be local or s3" -}}
{{- end -}}
{{- if and (gt $replicas 1) (not $s3) -}}
  {{- fail "replicas above 1 need storage.backend: s3; the /data claim is ReadWriteOnce" -}}
{{- end -}}
{{- if and (gt $replicas 1) (not (and .Values.cluster.cookie $auth.secretKeyBase)) -}}
  {{- fail "replicas above 1 need cluster.cookie and auth.secretKeyBase" -}}
{{- end -}}
{{- $legacy := .Values.main | default dict -}}
{{- $viewer := dig "auth" "enabled" false $legacy -}}
{{- $writer := dig "dashboard" "enabled" false $legacy -}}
{{- $legacyFlags := dict "SLIMSERVE_ENABLE_AUTH" false "SLIMSERVE_ENABLE_ADMIN" false -}}
{{- $legacyEnv := get $legacy "environments" | default list -}}
{{- range $key, $value := (get $legacy "options" | default dict) -}}
  {{- $legacyEnv = append $legacyEnv (dict "name" (upper $key) "value" $value) -}}
{{- end -}}
{{- if and .Release.IsUpgrade (ne (toString .Values.persistence.enabled) "true") (lookup "v1" "PersistentVolumeClaim" $namespace (include "slimserve.claim" .)) -}}
  {{- fail "cannot disable persistence on an upgrade with an existing data claim" -}}
{{- end -}}
{{- if .Release.IsUpgrade -}}
  {{- with lookup "apps/v1" "Deployment" $namespace $name -}}
    {{- range .spec.template.spec.containers -}}
      {{- $legacyEnv = concat $legacyEnv (.env | default list) -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- range $legacyEnv -}}
  {{- $value := toString .value -}}
  {{- if and (hasKey $legacyFlags .name) (or .valueFrom (contains "$(" $value) (has (lower $value) (list "true" "t" "1"))) -}}
    {{- $_ := set $legacyFlags .name true -}}
  {{- end -}}
{{- end -}}
{{- if and (or (eq (toString $viewer) "true") $legacyFlags.SLIMSERVE_ENABLE_AUTH) (not (and $auth.username $auth.password $auth.secretKeyBase)) -}}
  {{- fail "legacy Go viewer login requires auth.username, auth.password and auth.secretKeyBase" -}}
{{- end -}}
{{- if and (or (eq (toString $writer) "true") $legacyFlags.SLIMSERVE_ENABLE_ADMIN) (not $auth.writePassword) -}}
  {{- fail "legacy Go dashboard requires auth.writePassword" -}}
{{- end -}}
{{- if or (eq (toString $auth.enabled) "true") $auth.username $auth.password -}}
  {{- if not (and $auth.username $auth.password $auth.secretKeyBase) -}}
    {{- fail "viewer login requires auth.username, auth.password and auth.secretKeyBase" -}}
  {{- end -}}
{{- end -}}
{{- if and $auth.password $auth.writePassword (eq (toString $auth.password) (toString $auth.writePassword)) -}}
  {{- fail "auth.writePassword must differ from auth.password" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name | quote }}
  namespace: {{ $namespace | quote }}
spec:
  replicas: {{ $replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $name | quote }}
  template:
    metadata:
      labels:
        app: {{ $name | quote }}
      {{- if $hasCredentials }}
      annotations:
        slimserve/credentials-revision: {{ .Release.Revision | quote }}
      {{- end }}
    spec:
      securityContext:
        fsGroup: 1001
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name | quote }}
          image: {{ printf "%s:%s" .Values.image.main.repository (toString (default .Chart.AppVersion .Values.image.main.tag)) | quote }}
          imagePullPolicy: {{ .Values.image.main.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ int .Values.port }}
          env:
            - name: PHX_HOST
              value: {{ required "host is required; set it to the public hostname" .Values.host | quote }}
            - name: SLIMSERVE_HTTPS
              value: "true"
            - name: PORT
              value: {{ .Values.port | quote }}
            {{- if $s3 }}
            - name: SLIMSERVE_STORAGE
              value: s3
            - name: SLIMSERVE_S3_BUCKET
              value: {{ required "s3.bucket is required with storage.backend: s3" .Values.s3.bucket | quote }}
            {{- with .Values.s3.endpoint }}
            - name: AWS_ENDPOINT_URL_S3
              value: {{ . | quote }}
            {{- end }}
            - name: AWS_REGION
              value: {{ .Values.s3.region | quote }}
            - name: SLIMSERVE_DOWNLOAD_CACHE_MB
              value: {{ .Values.s3.downloadCacheMB | quote }}
            - name: SLIMSERVE_DOWNLOAD_CACHE_DIR
              value: /cache
            {{- $_ := required "s3.accessKeyId is required with storage.backend: s3" .Values.s3.accessKeyId }}
            {{- $_ := required "s3.secretAccessKey is required with storage.backend: s3" .Values.s3.secretAccessKey }}
            {{- else }}
            - name: SLIMSERVE_ROOT
              value: /data
            {{- end }}
            {{- if gt $replicas 1 }}
            # Each pod is slimserve@<its IP>; DNSCluster finds the others through the headless Service.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RELEASE_DISTRIBUTION
              value: name
            - name: RELEASE_NODE
              value: slimserve@$(POD_IP)
            - name: DNS_CLUSTER_QUERY
              value: {{ printf "%s.%s.svc.cluster.local" (include "slimserve.nodes" .) $namespace | quote }}
            {{- end }}
            - name: SLIMSERVE_THUMB_MAX_DIM
              value: {{ .Values.thumbnail.maxDimension | quote }}
            - name: SLIMSERVE_THUMB_MAX_FILE_SIZE_MB
              value: {{ .Values.thumbnail.maxFileSizeMB | quote }}
            - name: SLIMSERVE_THUMB_CACHE_MB
              value: {{ .Values.thumbnail.cacheMB | quote }}
            - name: SLIMSERVE_CACHE_DIR
              value: {{ .Values.thumbnail.cacheDir | quote }}
            - name: SLIMSERVE_UPLOAD_MAX_MB
              value: {{ .Values.upload.maxMB | quote }}
            - name: SLIMSERVE_UPLOAD_TYPES
              value: {{ .Values.upload.types | quote }}
            {{- with $auth.username }}
            - name: SLIMSERVE_USERNAME
              value: {{ . | quote }}
            {{- end }}
          {{- if $hasCredentials }}
          envFrom:
            - secretRef:
                name: {{ include "slimserve.secret" . | quote }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
                - name: Accept
                  value: text/html
          livenessProbe:
            tcpSocket:
              port: http
          {{- with .Values.resources.limits.main }}
          resources:
            limits:
              {{- toYaml . | nindent 14 }}
          {{- end }}
          volumeMounts:
            {{- if $s3 }}
            - name: download-cache
              mountPath: /cache
            {{- else }}
            - name: {{ printf "%s-data" .Release.Name | quote }}
              mountPath: /data
              {{- if eq (toString .Values.persistence.enabled) "true" }}
              subPath: subpath
              {{- end }}
            {{- end }}
      volumes:
        {{- if $s3 }}
        # The claim, if any, stays in place but unmounted, so switching back finds the files.
        # The kubelet counts blocks, not bytes: headroom over the cache's byte cap keeps a full cache from evicting the pod.
        - name: download-cache
          emptyDir:
            sizeLimit: {{ printf "%dMi" (add (div (mul (int .Values.s3.downloadCacheMB) 11) 10) 16) | quote }}
        {{- else }}
        - name: {{ printf "%s-data" .Release.Name | quote }}
          {{- if eq (toString .Values.persistence.enabled) "true" }}
          persistentVolumeClaim:
            claimName: {{ include "slimserve.claim" . | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
