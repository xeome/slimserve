image:
  main:
    repository: ghcr.io/xeome/slimserve
    pullPolicy: IfNotPresent
    tag: ""  # Defaults to the chart appVersion.

port: 8080
host: ""

persistence:
  enabled: null  # on for local storage, off on S3.

replicas: null  # 1 on local storage, 2 on S3.

storage:
  backend: local

s3:
  bucket: ""
  endpoint: ""  # AWS_ENDPOINT_URL_S3; AWS is untested, set it to https://s3.<region>.amazonaws.com there too.
  region: us-east-1
  accessKeyId: ""
  secretAccessKey: ""
  downloadCacheMB: 1024  # Per pod, in an emptyDir.

cluster:
  cookie: ""

networkPolicy:
  enabled: true

# Proxy addresses or CIDRs whose X-Forwarded-For the login limit trusts.
trustedProxies: []

service:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8080

resources:
  limits:
    main: {}
  requests:
    main:
      storage: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

thumbnail:
  maxDimension: 250
  maxFileSizeMB: 10
  cacheMB: 100
  cacheDir: /tmp/slimserve-thumbs

upload:
  maxMB: 100
  types: ""

auth:
  enabled: false
  username: ""
  password: ""
  writePassword: ""
  secretKeyBase: ""

# A Secret you manage, read in place of the credentials above. Keys: SLIMSERVE_PASSWORD,
# SLIMSERVE_WRITE_PASSWORD, SECRET_KEY_BASE, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, RELEASE_COOKIE.
existingSecret: ""
