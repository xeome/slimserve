name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  precommit:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock', '.tool-versions') }}
          restore-keys: ${{ runner.os }}-mix-
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      # inotifywait, for SlimServe.Watcher and its tests.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends inotify-tools
      - run: mix deps.get
      - run: mix precommit

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
