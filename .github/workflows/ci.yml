name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock', '.tool-versions') }}
          restore-keys: ${{ runner.os }}-mix-
      # inotifywait, for SlimServe.Watcher and its tests.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends inotify-tools
      - run: mix deps.get
      # mix ci runs the OpenSpec validate on bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: mix ci
      - uses: azure/setup-helm@v5
        with:
          version-file: .tool-versions
      - run: mix test --only helm

  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: slimserve:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/setup-helm@v5
        with:
          version-file: .tool-versions
      # Pinned, not left to the action's defaults, which install kind v0.33.0 but an older kubectl v1.37.1.
      # kind-action @v1 is v1.14.0, so it takes the exact v1.15.2 tag.
      # chart-testing-action @v2 (v2.8.0) cannot install ct 3.15.0, which publishes only a Sigstore bundle.
      - uses: helm/kind-action@v1.15.2
        with:
          install_only: true
          version: v0.33.0
          kubectl_version: v1.37.3
      - uses: helm/chart-testing-action@v2.9.0
        with:
          version: 3.15.0
      - name: Install kubeconform
        run: |
          curl -sSfL -o "$RUNNER_TEMP/kubeconform.tar.gz" https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C /usr/local/bin kubeconform
      - run: bash scripts/kind-test.sh
        env:
          SKIP_BUILD: "1"

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
